<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Karina Blanchette — social preview artwork</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
    body { background: #0b1009; color: #eef2e9; font-family: Arial, sans-serif; padding: 52px 60px; }
    .brand { display: flex; align-items: center; gap: 16px; font-size: 20px; font-weight: 600; }
    .brand img { width: 46px; height: 46px; }
    .role { color: #b8e875; font: 13px monospace; letter-spacing: 2px; margin-top: 66px; }
    h1 { position: relative; z-index: 2; margin: 22px 0; font-size: 76px; font-weight: 500; line-height: 0.98; letter-spacing: -5px; }
    em { color: #b8e875; font-family: Georgia, serif; font-weight: 400; }
    .summary { width: 530px; color: #abb3a5; font-size: 19px; line-height: 1.6; }
    .portrait { position: absolute; right: 48px; top: 44px; width: 400px; height: 542px; object-fit: cover; object-position: 50% 6%; border-radius: 18px; }
    .footer { position: absolute; bottom: 48px; left: 60px; width: 632px; padding-top: 20px; border-top: 1px solid #34412b; display: flex; justify-content: space-between; color: #abb3a5; font: 12px monospace; }
  </style>
</head>
<body>
  <div class="brand"><img src="../logo-mark.svg" alt="">Karina Blanchette</div>
  <p class="role">QUALITY ENGINEERING / NEW YORK CITY</p>
  <h1>Software people<br>can <em>trust.</em></h1>
  <p class="summary">Test automation. Clear risk signals.<br>Confidence in every release.</p>
  <img class="portrait" src="../portrait-karina.jpg" alt="Portrait of Karina Blanchette">
  <div class="footer"><span>AUTOMATION · API · DATA</span><span>karinablanchette.github.io</span></div>
</body>
</html>
